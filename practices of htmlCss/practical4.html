<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
        }


        .left-panel {
            width: 40%;
            background: linear-gradient(180deg, #7a3cff, #1b2dd6);
            color: #fff;
            padding: 60px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .left-panel h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .left-panel p {
            font-size: 18px;
            line-height: 30px;
            opacity: .9;
        }

        .illustration {
            margin-top: 70px;
            position: relative;
        }

        .shield {
            font-size: 130px;
            opacity: .2;
        }

        .lock {
            font-size: 70px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .right-panel {
            width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
            background: #fafafa;
        }

        .login-box {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 45px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, .08);
        }

        .login-box h2 {
            font-size: 38px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: 600;
        }

        .input-box {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .input-box i {
            color: #777;
        }

        .input-box input {
            border: none;
            outline: none;
            flex: 1;
            padding: 0 10px;
            font-size: 16px;
        }

        .forgot {
            float: right;
            margin: 10px 0 25px;
            text-decoration: none;
            color: #6b3eff;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #6d3cff, #8d52ff);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            opacity: .9;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
        }

        .signup a {
            text-decoration: none;
            color: #6b3eff;
            font-weight: bold;
        }

       

        @media(max-width:768px) {

            .container {
                flex-direction: column;
            }

            .left-panel {
                width: 100%;
                padding: 50px 20px;
            }

            .right-panel {
                width: 100%;
                padding: 20px;
            }

            .login-box {
                padding: 30px 20px;
            }

            .left-panel h1 {
                font-size: 32px;
            }

            .login-box h2 {
                font-size: 30px;
            }

            .shield {
                font-size: 90px;
            }

            .lock {
                font-size: 45px;
            }

        }
    </style>

</head>

<body>
    <div class="container">

    
        <div class="left-panel">

            <div class="content">
                <h1>Welcome Back!</h1>
                <p>Please login to your account<br>to continue.</p>

                <!-- <div class="illustration">
                    <i class="fa-solid fa-shield-halved shield"></i>
                    <i class="fa-solid fa-lock lock"></i>
                </div> -->

            </div>

        </div>

        <div class="right-panel">

            <div class="login-box">

                <h2>Login</h2>

                <label>Username</label>

                <div class="input-box">
                    <i class="fa fa-user"></i>
                    <input type="text" placeholder="Enter your username">
                </div>

                <label>Password</label>

                <div class="input-box">
                    <i class="fa fa-lock"></i>
                    <input type="password" placeholder="Enter your password">
                    <i class="fa fa-eye"></i>
                </div>

                <a href="#" class="forgot">Forgot Password?</a>

                <button>Login</button>

                <p class="signup">
                    Don't have an account?
                    <a href="#">Sign Up</a>
                </p>

            </div>

        </div>

    </div>



</body>

</html>
