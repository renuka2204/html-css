<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow,FlexBox</title>
    <style>
        nav{
            display: flex;
            justify-content: space-between;
            padding: 20px;
            border: 2px solid black;
        }
        .menu{
            display: flex;
            gap: 20px;
            top: 20px 0px;
        }
        a{
            text-decoration: none;
        }
        
    </style>
</head>
<body>
    <nav>
        <div class="logo"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgDs5CVGyhFdTflQ6ljwPRSp6hYFsfX64fH2i4bnxUmQ&s" alt="Logo" width="80"></div>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>
</body>
</html>
