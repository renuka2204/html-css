        color: red;


    }

    nav {
        display: flex;

        padding: 2px;
        border: 3px solid black;
        margin: 10px;
    }

        display: flex;
        gap: 50px;
        align-items: end;
    }

        text-decoration: none;
        font-size: 20px;
    }

        display: flex;
        flex-wrap: wrap;
        gap: 20px;

    }

        width: 100px;
        height: 200px;
        border: 2px solid black;
        margin: 45px;
        padding: 80px;
        text-align: center;
        border-radius: 30px;
        background-color: antiquewhite;
    }

    .card img {
        width: 120px;
        height: 150px;


    }

    p {
        font-size: 10px;
        color: black;
        font-weight: bold;
    }

    .order {
        background-color: black;
        border-radius: 10px;
        color: white;
        font-size: 15px;
    }
</style>
