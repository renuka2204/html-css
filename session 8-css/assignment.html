<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>


<style>
    body{
        background-color: lightskyblue;
    }
    .card {
        background-color: azure;
        width: 300px;
        border: 2px solid black;
        padding: 20px;
        margin: 20px;
        margin-left: 200px;
        text-align: center;
        font-family: 'Times New Roman', Times, serif;
        border-radius: 25px;
    }

    h4 {
        color: darkred;
    }

    p,
    h3 {
        color: black;
    }

    .button {
        display: inline-block;
        margin-top: 10px;
        padding: 10px 20px;
        background: #4facfe;
        color: white;
        text-decoration: none;
        border-radius: 25px;
    }
    .img{
        width: 120px;
        height: 120px;
        border-radius: 50px;
        border: 2px solid black;
        object-fit: cover;
        margin-bottom: 15px;
        
    }
</style>
</head>

<body>
    <div class="card">
        <img class="img" width="200" height="100"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6k2pIMgP8evMwLfKFW_tRz5sfDKzgLLbteMMVjGIDMA&s=10">
        <h2>Renuka Shinge</h2>
        <h4>Student</h4>
        <p class="title">Full Stack Developer</p>
        <p class="title">renukashinge14@gmail.com</p><br>
        <a href="#" class="button">View Profile</a>



    </div>
</body>

</html>
