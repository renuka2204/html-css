    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #screencnt {
            border: 3px solid red;
            height: 100vh;
        }

        #navbarcnt {
            margin: 2%;
            height: 5vh;
            display: flex;
            gap: 2%;
        }

        #logocnt {
            width: 8%;
            background-color: #FFE51F;
            border-radius: 10px;
        }

        #menucnt {
            /* border: 2px solid yellow; */
            display: flex;
            /* justify-content: space-between; */
            height: 7vh;
            width: 95%;
            margin: 2%;
            border-radius: 1px;
            border-bottom: 1px solid black;
            padding-bottom: 15px;
        }

        .icon {
            /* border: 2px solid black; */
            width: 30px;
            border-bottom-left-radius: 10px;
            border-top-left-radius: 10px;
            display: flex;
            align-items: center;
           
        }

        .serachcnt {
            /* border: 1px solid black; */
            width: 60%;
            border-bottom-right-radius: 10px;
            border-top-right-radius: 10px;
            align-items: center;
            display: flex;
            outline: none;  
        }

        .imgcnt {
            width: 25px;
            height: 25px;
            padding-left: 1px;
        }

        .wh-100 {
            width: 100%;
            height: 100%;
        }

        #logincnt {
            display: flex;
            align-items: center;
        }

        .container {
            /* border: 2px solid blue; */
            width: 30%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        #cartcnt {
            display: flex;
            align-items: center;
        }

        #navcat {
            /* border-bottom: 1px solid black; */
            height: 55px;
            width: 95%;
            margin: 20px;
        }

        .p {
            display: flex;
            justify-content: space-around;

        }

        #bodycnt {
            /* border: 2px solid black; */
            height: 45%;
            width: 95%;
            padding-left: 3%;
        }

        @media (max-width: 700px) {}
    </style>
</head>
