<!DOCTYPE html>
<html>
    <head>
        <title>Delivery Tracking</title>
    </head>
    <body>
        <form>
           <fieldset>
            <table>
            <h2>Personal Information</h2>
            <hr>
             <tr>
                <td><label for="name">Name :</label></td>
                <td><input id="name" type="text" placeholder="Enter your name"><br /><br /></td>
            </tr>
            <tr>
                <td><label for="email">Email :</label></td>
                <td><input id="email" type="text" placeholder="Enter your email"><br /><br /></td>
            </tr>
            <tr>
                <td><label for="number">Contact number :</label></td>
                <td><input id="number" type="text" placeholder="phone"></td>
            </tr>
            </table>
            <h2>Order Information</h2>
            <hr>
            <table>
                <tr>
                    <td><label for="Order ID">Order ID :</label></td>
                    <td><input id="Order ID" placeholder="Enter ID"><br /><br /></td>
                </tr>
                <tr>
                    <td><label for="Destination">Delivery Destination :</label></td>
                    <td><input id="Destination" placeholder="Enter Destination"><br /><br /></td>
                </tr>
                <tr>
                    <td><label for="Address">Street Address :</label></td>
                    <td><input id="Address" type="text" placeholder="Address"><br /><br /></td> 
                </tr>
                <tr>
                    <td><label for="line 2">Address Line 2 :</label></td> 
                    <td><input id="line 2" type="text" placeholder="Address 2"></td> 
                    <td><label for="state">State/region/province :</label></td>
                    <td><input id="state" type="text" placeholder="Enter your state"></td>
                </tr> 
                <tr> 
                    <td><label>City :</label></td> 
                    <td><input type="text" placeholder="City"><br /><br /></td> 

                    <td><br><label>Country:</label><br><br><br></td>
                    <td><select>
                        <option>Country</option>
                        <option>goa</option>
                        <option>gujarat</option>
                        <option>maharashtra</option>
                        <option>rajashtan</option>
                    </select><br /><br /></td>
                </tr>
                <tr>
                    <td><label>When did you place your order?</label></td>
                    <td><input type="date"></td>
                </tr>
            </table>
            <br />
            <button type="submit">Submit</button>
           </fieldset>

            
            




        </form>
    </body>
</html>
