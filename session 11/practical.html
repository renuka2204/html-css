<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border: 2px solid black;
            background: linear-gradient(to right, #4facfe);
        }

        h1 {
            color: aliceblue;
        }

        .menu {
            display: flex;
            gap: 60px;
            top: 30px 0px;
            align-items: end;
            font-size: 20px;

        }

        a {
            text-decoration: none;
            color: aliceblue;
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            background: linear-gradient(to right, #1d858c);
            text-align: center;
            color: white;
            padding: 5px;
           flex-direction: column;
        }
        .btn{
            background-color: #4facfe;
            border-radius: 5px;
            padding: 10px 20px;
            color: white;
            font-size: 16px;
        }
        .foo{
            display: flex;
            justify-content: center;
            text-align: center;
            font-size: 15px;
            background-color: #4facfe;
            padding: 20px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <!--navbar-->
    <nav>
        <h1>My Website</h1>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>
    <!-- <Hero> -->
    <section class="hero">
        <h1>Welcome To My Website</h1><br>
        <p>This is a simple responsive landing page.</p><br><br><br>
        <button class="btn">Get Started</button>
    </section>
    <!-- <footer> -->
    <footer class="foo">
        <p>&copy; 2023 My Website. All rights reserved.</p>
    </footer>

</body>

</html>
