<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
</head>
<style>
    body {
        border: 5px solid red;
        height: 300vh;
        margin: 0px;
        padding: 0px;
    }

    h1 {
        border: 3px solid rgb(246, 70, 70);
        width: 1000px;
        height: 50px;
        margin: 0px 250px;
        color: deeppink;
        text-align: center;
        background-color: antiquewhite;
    }

    nav {
        text-align: center;
    }

    a {
        text-decoration: none;
        margin: 0px 150px;
        font-size: 20px;
    }

    .mycnt {
        border-color: 2px solid black;
        display: flex;
        flex-direction: row;
        height: 100vh;
        height: 100px;
        position: static;
    }

    .yellow {
        background-color: yellow;
        width: 200px;
        height: 200px;
        margin-left: 350px;
        margin-right: 10px;
        position: relative;
        top: 50px;
        right: 50px;
        left: 10px;
        bottom: 150px;
    }

    .pinkcnt {
        background-color: pink;
        width: 200px;
        height: 200px;
        margin-left: 130px;
        margin-right: 10px;
        position: absolute;
        left: 900px;
        right: 1000px;
    }

    .bluecnt {
        background-color: blue;
        color: aliceblue;
        width: 200px;
        height: 200px;
        margin-left: 110px;
        margin-right: 10px;
        position: sticky;
        top: 400px;
        left: 500px;
    }

    .img {
        margin-left: 1400px;
        margin-top: 300px;
        border: 2px solid black;
        position: sticky;
        position: fixed;
        border-radius: 50%;
    }
</style>

<body><br><br>

    <h1>Myntra</h1>
    <nav><br><br>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="mycnt">
        <div class="yellow">1</div>
        <div class="bluecnt">2</div>
        <div class="pinkcnt">3</div>
